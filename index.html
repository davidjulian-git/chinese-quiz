<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Study & Quiz App</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-dark: #1e293b;
            --card-border: #334155;
            --primary: #f97316;
            --primary-hover: #ea580c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        header {
            text-align: center;
            margin-bottom: 16px;
        }
        header h1 {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin: 0;
            font-weight: 500;
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        nav button {
            background-color: #334155;
            color: var(--text-muted);
        }
        nav button.active-tab {
            background-color: var(--primary);
            color: white;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button.secondary {
            background-color: #334155;
            color: var(--text-main);
        }
        button.secondary:hover {
            background-color: #475569;
        }
        .tab-content {
            display: none;
            background: var(--card-dark);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-muted);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
            font-family: monospace;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid var(--card-border);
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #0f172a;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .progress-bar-container {
            flex-grow: 1;
            margin: 0 15px;
            background: #0f172a;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .quiz-card-box {
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 16px;
        }
        .prompt-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0 20px 0;
            letter-spacing: 2px;
            word-break: break-word;
        }
        .prompt-instruction {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .option-btn {
            background-color: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 16px;
            font-size: 1.5rem; /* Larger font for readability */
            font-weight: 500;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }
        .option-btn:hover {
            background-color: #334155;
        }
        .feedback-box {
            margin-top: 16px;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            display: none;
        }
        .feedback-correct {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
        }
        .feedback-incorrect {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid var(--error);
        }
        .backup-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Chinese Study App</h1>
    </header>

    <nav>
        <button id="nav-quiz" class="active-tab" onclick="switchTab('quiz')">Study Quiz</button>
        <button id="nav-manage" onclick="switchTab('manage')">Manage Words</button>
    </nav>

    <!-- QUIZ TAB -->
    <div id="quiz-tab" class="tab-content active">
        <div id="quiz-setup">
            <h2 style="margin-top:0;">Quiz Settings</h2>
            <div class="form-group">
                <label>Mode:</label>
                <select id="quiz-mode">
                    <option value="mc">Multiple Choice</option>
                    <option value="write">Write-in Answer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Question Type:</label>
                <select id="quiz-type">
                    <option value="random">🎲 Randomize All Types (Mixed)</option>
                    <option value="c2e">Chinese Character -> English</option>
                    <option value="c2p">Chinese Character -> Pinyin</option>
                    <option value="p2c">Pinyin -> Chinese Character</option>
                    <option value="e2c">English -> Chinese Character</option>
                    <option value="p2e">Pinyin -> English</option>
                    <option value="e2p">English -> Pinyin</option>
                </select>
            </div>
            <button style="width: 100%; margin-top: 10px;" onclick="startQuiz()">Start Session</button>
        </div>

        <div id="quiz-active" style="display: none;">
            <div class="quiz-header">
                <span id="exit-btn" style="cursor:pointer; color: var(--error);" onclick="endQuiz()">✕ Exit</span>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <span id="progress-text">0/0</span>
            </div>

            <div class="quiz-card-box">
                <div id="prompt-instruction" class="prompt-instruction">Translate this:</div>
                <div id="prompt-text" class="prompt-display"></div>
                
                <!-- Multiple Choice Container -->
                <div id="mc-container" class="options-grid"></div>

                <!-- Write-in Container -->
                <div id="write-container" style="display: none;">
                    <input type="text" id="user-answer" placeholder="Type your answer here..." autocomplete="off">
                    <button style="margin-top: 12px; width: 100%;" onclick="submitWriteAnswer()">Submit Answer</button>
                </div>

                <div id="feedback-area" class="feedback-box"></div>
                <button id="next-btn" style="margin-top: 16px; width: 100%; display: none;" onclick="nextQuestion()">Next Question</button>
            </div>
        </div>
    </div>

    <!-- MANAGE VOCABULARY TAB -->
    <div id="manage-tab" class="tab-content">
        <h2 style="margin-top:0;">Manage Vocabulary</h2>
        
        <!-- Bulk Import -->
        <div style="background: #0f172a; padding: 16px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 20px;">
            <h3 style="margin-top:0; color:var(--text-main);">Bulk Import Words</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Paste format: <code>Chinese, Pinyin, English</code> (one word per line)</p>
            <div class="form-group" style="margin-bottom: 10px;">
                <textarea id="bulk-input" placeholder="台灣, Táiwān, Taiwan&#10;學校, xuéxiào, School"></textarea>
            </div>
            <button onclick="bulkImport()">Import List</button>
        </div>

        <!-- Single Add -->
        <details style="background: #0f172a; padding: 16px; border-radius: 12px; border: 1px solid var(--card-border);">
            <summary style="font-weight:600; cursor:pointer; color: var(--text-muted);">Add Single Word Manually</summary>
            <div class="form-group" style="margin-top: 12px;">
                <label>Chinese Characters:</label>
                <input type="text" id="input-chinese" placeholder="e.g., 台灣">
            </div>
            <div class="form-group">
                <label>Pinyin:</label>
                <input type="text" id="input-pinyin" placeholder="e.g., Táiwān">
            </div>
            <div class="form-group">
                <label>English Translation:</label>
                <input type="text" id="input-english" placeholder="e.g., Taiwan">
            </div>
            <button onclick="addVocab()">Add Word</button>
        </details>

        <h3 style="margin-top: 30px;">Saved Vocabulary (<span id="vocab-count">0</span>)</h3>
        <div style="max-height: 300px; overflow-y: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Chinese</th>
                        <th>Pinyin</th>
                        <th>English</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="vocab-table-body"></tbody>
            </table>
        </div>

        <div class="backup-section">
            <button class="secondary" onclick="exportVocab()">Export JSON</button>
            <button class="secondary" style="background-color: var(--error);" onclick="clearAllVocab()">Delete All</button>
        </div>
    </div>

    <script>
        let vocabList = JSON.parse(localStorage.getItem('chinese_vocab')) || [
            { chinese: "學校", pinyin: "xuéxiào", english: "School" },
            { chinese: "台灣", pinyin: "Táiwān", english: "Taiwan" },
            { chinese: "謝謝", pinyin: "xièxie", english: "Thank you" },
            { chinese: "早安", pinyin: "zǎo'ān", english: "Good morning" }
        ];

        let quizQueue = [];
        let totalItemsInSession = 0;
        let currentQuizItem = null;
        let currentActiveType = 'c2e';

        function saveVocabToStorage() {
            localStorage.setItem('chinese_vocab', JSON.stringify(vocabList));
            updateVocabTable();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            
            // Update Navigation Button Active States
            document.getElementById('nav-quiz').classList.remove('active-tab');
            document.getElementById('nav-manage').classList.remove('active-tab');

            if (tabName === 'quiz') {
                document.getElementById('quiz-tab').classList.add('active');
                document.getElementById('nav-quiz').classList.add('active-tab');
                document.getElementById('quiz-setup').style.display = 'block';
                document.getElementById('quiz-active').style.display = 'none';
            } else {
                document.getElementById('manage-tab').classList.add('active');
                document.getElementById('nav-manage').classList.add('active-tab');
                updateVocabTable();
            }
        }

        function addVocab() {
            const chinese = document.getElementById('input-chinese').value.trim();
            const pinyin = document.getElementById('input-pinyin').value.trim();
            const english = document.getElementById('input-english').value.trim();

            if (!chinese || !pinyin || !english) {
                alert('Please fill in all three fields.');
                return;
            }

            vocabList.push({ chinese, pinyin, english });
            saveVocabToStorage();

            document.getElementById('input-chinese').value = '';
            document.getElementById('input-pinyin').value = '';
            document.getElementById('input-english').value = '';
            alert('Word added successfully!');
        }

        function bulkImport() {
            const text = document.getElementById('bulk-input').value.trim();
            if (!text) return;

            const lines = text.split('\n');
            let addedCount = 0;

            lines.forEach(line => {
                const parts = line.split(',').map(p => p.trim());
                if (parts.length >= 3) {
                    vocabList.push({
                        chinese: parts[0],
                        pinyin: parts[1],
                        english: parts.slice(2).join(', ')
                    });
                    addedCount++;
                }
            });

            if (addedCount > 0) {
                saveVocabToStorage();
                document.getElementById('bulk-input').value = '';
                alert(`Successfully imported ${addedCount} words!`);
            } else {
                alert('Invalid format. Use: Chinese, Pinyin, English');
            }
        }

        function deleteVocab(index) {
            vocabList.splice(index, 1);
            saveVocabToStorage();
        }

        function clearAllVocab() {
            if (confirm('Delete all saved vocabulary?')) {
                vocabList = [];
                saveVocabToStorage();
            }
        }

        function exportVocab() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(vocabList));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "chinese_vocab_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function updateVocabTable() {
            const tbody = document.getElementById('vocab-table-body');
            tbody.innerHTML = '';
            document.getElementById('vocab-count').innerText = vocabList.length;
            
            vocabList.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.chinese}</td>
                    <td>${item.pinyin}</td>
                    <td>${item.english}</td>
                    <td><button class="secondary" style="padding: 4px 8px; background-color: var(--error);" onclick="deleteVocab(${index})">✕</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startQuiz() {
            if (vocabList.length < 4) {
                alert('Please add at least 4 vocabulary words before starting a quiz.');
                return;
            }

            quizQueue = shuffle([...vocabList]);
            totalItemsInSession = quizQueue.length;

            document.getElementById('quiz-setup').style.display = 'none';
            document.getElementById('quiz-active').style.display = 'block';

            const mode = document.getElementById('quiz-mode').value;
            if (mode === 'write') {
                document.getElementById('mc-container').style.display = 'none';
                document.getElementById('write-container').style.display = 'block';
            } else {
                document.getElementById('mc-container').style.display = 'grid';
                document.getElementById('write-container').style.display = 'none';
            }

            loadQuestion();
        }

        function endQuiz() {
            document.getElementById('quiz-setup').style.display = 'block';
            document.getElementById('quiz-active').style.display = 'none';
        }

        function loadQuestion() {
            if (quizQueue.length === 0) {
                alert('🎉 Session complete! You successfully mastered all words.');
                endQuiz();
                return;
            }

            const completed = totalItemsInSession - quizQueue.length;
            const percent = (completed / totalItemsInSession) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').innerText = `${completed}/${totalItemsInSession}`;

            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.style.display = 'none';
            feedbackArea.className = 'feedback-box';
            document.getElementById('next-btn').style.display = 'none';

            currentQuizItem = quizQueue[0];

            let settingType = document.getElementById('quiz-type').value;
            const allTypes = ['c2e', 'c2p', 'p2c', 'e2c', 'p2e', 'e2p'];
            currentActiveType = settingType === 'random' ? allTypes[Math.floor(Math.random() * allTypes.length)] : settingType;

            let promptText = '';
            let promptLabel = '';
            let correctAnswer = '';
            let targetKey = '';

            if (currentActiveType === 'c2e') {
                promptLabel = "Prompt: Provide the English";
                promptText = currentQuizItem.chinese;
                correctAnswer = currentQuizItem.english;
                targetKey = 'english';
            } else if (currentActiveType === 'c2p') {
                promptLabel = "Prompt: Provide the Pinyin";
                promptText = currentQuizItem.chinese;
                correctAnswer = currentQuizItem.pinyin;
                targetKey = 'pinyin';
            } else if (currentActiveType === 'p2c') {
                promptLabel = "Prompt: Provide the Characters";
                promptText = currentQuizItem.pinyin;
                correctAnswer = currentQuizItem.chinese;
                targetKey = 'chinese';
            } else if (currentActiveType === 'e2c') {
                promptLabel = "Prompt: Provide the Characters";
                promptText = currentQuizItem.english;
                correctAnswer = currentQuizItem.chinese;
                targetKey = 'chinese';
            } else if (currentActiveType === 'p2e') {
                promptLabel = "Prompt: Provide the English";
                promptText = currentQuizItem.pinyin;
                correctAnswer = currentQuizItem.english;
                targetKey = 'english';
            } else if (currentActiveType === 'e2p') {
                promptLabel = "Prompt: Provide the Pinyin";
                promptText = currentQuizItem.english;
                correctAnswer = currentQuizItem.pinyin;
                targetKey = 'pinyin';
            }

            document.getElementById('prompt-instruction').innerText = promptLabel;
            document.getElementById('prompt-text').innerText = promptText;

            const mode = document.getElementById('quiz-mode').value;
            if (mode === 'mc') {
                setupMultipleChoice(correctAnswer, targetKey);
            } else {
                document.getElementById('user-answer').value = '';
                document.getElementById('user-answer').focus();
            }
        }

        function setupMultipleChoice(correctAnswer, targetKey) {
            const container = document.getElementById('mc-container');
            container.innerHTML = '';

            let wrongOptions = vocabList
                .filter(i => i[targetKey] !== correctAnswer)
                .map(i => i[targetKey]);
            
            wrongOptions = shuffle(wrongOptions).slice(0, 3);
            let choices = shuffle([correctAnswer, ...wrongOptions]);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(choice === correctAnswer, correctAnswer);
                container.appendChild(btn);
            });
        }

        function submitWriteAnswer() {
            const userText = document.getElementById('user-answer').value.trim();
            if (!userText) return;

            let correctAnswer = '';
            if (currentActiveType === 'c2e' || currentActiveType === 'p2e') correctAnswer = currentQuizItem.english;
            else if (currentActiveType === 'c2p' || currentActiveType === 'e2p') correctAnswer = currentQuizItem.pinyin;
            else correctAnswer = currentQuizItem.chinese;

            const isCorrect = userText.toLowerCase() === correctAnswer.toLowerCase();
            checkAnswer(isCorrect, correctAnswer);
        }

        function checkAnswer(isCorrect, correctAnswer) {
            const feedback = document.getElementById('feedback-area');
            feedback.style.display = 'block';

            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

            if (isCorrect) {
                feedback.className = 'feedback-box feedback-correct';
                feedback.innerHTML = '✨ CORRECT!! Fantastic!';
                quizQueue.shift();
            } else {
                feedback.className = 'feedback-box feedback-incorrect';
                feedback.innerHTML = `❌ Incorrect. Correct: <strong>${correctAnswer}</strong>`;
                const missedItem = quizQueue.shift();
                quizQueue.push(missedItem);
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            loadQuestion();
        }

        updateVocabTable();
    </script>
</body>
</html>
