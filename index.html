<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandarin Flashcard & Translation Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold text-slate-900">Mandarin Trainer</h1>
            <div id="mode-indicator" class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-full">
                Sentence Translation Mode
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center">

        <!-- Card Box -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 transition-all">
            
            <!-- Prompt Display -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-3">
                    <span id="card-counter" class="text-xs font-medium text-slate-400 uppercase tracking-wider">Question 1 of 4</span>
                    <span id="direction-badge" class="text-xs font-medium px-2 py-0.5 bg-slate-100 text-slate-600 rounded">EN ➔ 中文</span>
                </div>
                
                <h2 id="prompt-text" class="text-xl md:text-2xl font-semibold text-slate-900 leading-snug min-h-[4rem] flex items-center">
                    Do you want to take the MRT together?
                </h2>
                
                <div id="phonetic-container" class="mt-2 text-sm text-slate-500 hidden">
                    <p id="phonetic-zhuyin" class="font-mono text-indigo-600"></p>
                    <p id="phonetic-pinyin" class="italic"></p>
                </div>
            </div>

            <!-- Input Area -->
            <div id="input-section" class="space-y-4">
                <div>
                    <label for="user-input" class="block text-xs font-medium text-slate-500 mb-1">Your Translation:</label>
                    <textarea id="user-input" rows="3" class="w-full rounded-xl border border-slate-300 p-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-base" placeholder="Type your translation here..."></textarea>
                </div>
                
                <div class="flex gap-3">
                    <button id="submit-btn" onclick="checkAnswer()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition-colors shadow-sm">
                        Submit Answer
                    </button>
                    <button id="reveal-btn" onclick="revealAnswer()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 px-4 rounded-xl transition-colors text-sm">
                        Reveal
                    </button>
                </div>
            </div>

            <!-- Feedback Box (Hidden by default) -->
            <div id="feedback-section" class="hidden mt-6 pt-6 border-t border-slate-100 space-y-4">
                <div id="result-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"></div>
                
                <div class="bg-slate-50 p-4 rounded-xl space-y-2 text-sm">
                    <div>
                        <span class="text-slate-400 font-medium block text-xs">Correct Target:</span>
                        <span id="correct-target-text" class="text-slate-900 font-semibold text-base"></span>
                    </div>
                    <div id="user-diff-container" class="hidden">
                        <span class="text-slate-400 font-medium block text-xs">What you wrote:</span>
                        <span id="user-submitted-text" class="text-red-600 line-through"></span>
                    </div>
                </div>

                <div id="grammar-box" class="bg-indigo-50/50 border border-indigo-100 p-4 rounded-xl">
                    <h3 class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-1">Grammar Breakdown</h3>
                    <p id="grammar-text" class="text-sm text-indigo-950 leading-relaxed"></p>
                </div>

                <button onclick="nextCard()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-xl transition-colors">
                    Next Sentence ➔
                </button>
            </div>

        </div>

    </main>

    <!-- Footer Controls -->
    <footer class="bg-white border-t border-slate-200 py-3 px-4 text-center text-xs text-slate-400">
        Single-file offline app • Target: Traditional Chinese, Zhuyin, Pinyin
    ></footer>

    <script>
        // Sentence Database (Combines your vocabulary list items & common lower-intermediate structures)
        const sentencePool = [
            {
                id: "s1",
                direction: "en-to-zh", // English to Chinese
                prompt: "Do you want to take the MRT together?",
                answer: "你要一起搭捷運嗎？",
                zhuyin: "ㄋㄧˇ ㄧㄠˋ ㄧㄑㄧˇ ㄉㄚ ㄐㄧㄝˊㄩㄣˋ ㄇㄚ?",
                pinyin: "Nǐ yào yīqǐ dā jiéyùn ma?",
                grammarNote: "Uses '要' (want to/going to) for future intent, and '一起' (together) directly preceding the verb '搭' (to take/ride transportation)."
            },
            {
                id: "s2",
                direction: "en-to-zh",
                prompt: "Is this for dine-in or takeout?",
                answer: "請問要內用還是外帶？",
                zhuyin: "ㄑㄧㄥˇㄨㄣˋ ㄧㄠˋ ㄋㄟˋㄩㄥˋ ㄏㄞˊㄕˋ ㄨㄞˋㄉㄞˋ?",
                pinyin: "Qǐngwèn yào nèiyòng háishì wàidài?",
                grammarNote: "Uses '還是' (háishì) for 'or' in questions, contrasting '內用' (dine-in) and '外帶' (takeout) which are core daily restaurant phrases."
            },
            {
                id: "s3",
                direction: "zh-to-en", // Chinese to English
                prompt: "捷運站附近有沒有好吃的餐廳？",
                zhuyin: "ㄐㄧㄝˊㄩㄣˋ ㄓㄢˋ ㄈㄨˋㄐㄧㄣˋ ㄧㄡˇㄇㄟˊㄧㄡˇ ㄏㄠˇㄔ˙ ㄉㄜ˙ ㄘㄢㄊㄧㄥ?",
                pinyin: "Jiéyùn zhàn fùjìn yǒu méiyǒu hǎochī de cāntīng?",
                answer: "Are there any delicious restaurants near the MRT station?",
                grammarNote: "Constructions with '附近' (nearby) follow the location noun ('捷運站附近'). '有沒有' functions as the standard question form for existence."
            },
            {
                id: "s4",
                direction: "en-to-zh",
                prompt: "I want to order bubble tea with less ice.",
                answer: "我要點少冰的珍珠奶茶。",
                zhuyin: "ㄨㄛˋ ㄧㄠˋ ㄉㄧㄢˇ ㄕㄠˇㄅㄧㄥ ㄉㄜ˙ ㄓㄣㄓㄨ ㄋㄞˇㄔㄚˊ.",
                pinyin: "Wǒ yào diǎn shǎobīng de zhēnzhū nǎichá.",
                grammarNote: "Beverage customization modifies the ice level ('少冰') before the noun using '的', with '點' serving as the active verb for ordering food/drink."
            }
        ];

        let currentIndex = 0;

        function loadCard() {
            const card = sentencePool[currentIndex];
            
            // Update counter and mode badge
            document.getElementById("card-counter").innerText = `Question ${currentIndex + 1} of ${sentencePool.length}`;
            
            const badge = document.getElementById("direction-badge");
            if (card.direction === "en-to-zh") {
                badge.innerText = "EN ➔ 中文";
                document.getElementById("prompt-text").innerText = card.prompt;
                document.getElementById("phonetic-container").classList.add("hidden");
            } else {
                badge.innerText = "中文 ➔ EN";
                document.getElementById("prompt-text").innerText = card.prompt;
                document.getElementById("phonetic-zhuyin").innerText = card.zhuyin;
                document.getElementById("phonetic-pinyin").innerText = card.pinyin;
                document.getElementById("phonetic-container").classList.remove("hidden");
            }

            // Reset input and views
            document.getElementById("user-input").value = "";
            document.getElementById("input-section").classList.remove("hidden");
            document.getElementById("feedback-section").classList.add("hidden");
        }

        function sanitize(str) {
            return str
                .toLowerCase()
                .trim()
                .replace(/[\s.,\/#!$%\^&\*;:{}=\-_`~()？，。！"'“”‘’]/g, "");
        }

        function checkAnswer() {
            const card = sentencePool[currentIndex];
            const userText = document.getElementById("user-input").value;
            
            if (!userText.trim()) return; // Don't submit empty

            const cleanUser = sanitize(userText);
            const cleanCorrect = sanitize(card.answer);
            
            const isCorrect = (cleanUser === cleanCorrect);

            showFeedback(isCorrect, userText, card);
        }

        function revealAnswer() {
            const card = sentencePool[currentIndex];
            showFeedback(false, "[Revealed without guessing]", card);
        }

        function showFeedback(isCorrect, userText, card) {
            document.getElementById("input-section").classList.add("hidden");
            document.getElementById("feedback-section").classList.remove("hidden");

            const resultBadge = document.getElementById("result-badge");
            const userDiffContainer = document.getElementById("user-diff-container");
            
            if (isCorrect) {
                resultBadge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-100 text-emerald-800";
                resultBadge.innerText = "Correct! 太棒了！";
                userDiffContainer.classList.add("hidden");
            } else {
                resultBadge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-rose-100 text-rose-800";
                resultBadge.innerText = "Not Quite Right";
                document.getElementById("user-submitted-text").innerText = userText;
                userDiffContainer.classList.remove("hidden");
            }

            document.getElementById("correct-target-text").innerText = card.answer + (card.direction === "en-to-zh" ? ` (${card.pinyin})` : "");
            document.getElementById("grammar-text").innerText = card.grammarNote;
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % sentencePool.length;
            loadCard();
        }

        // Initialize first card on load
        window.onload = loadCard;
    </script>
</body>
</html>
